[project]
name = "web3-quant-master"
version = "3.5.0"
description = "Web3量化交易助手 - 策略诊断、因子分析、风控检测、技术选型、数据获取、回测、模拟交易、价格预警、组合分析"
authors = [{name = "xiaomi"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "openpyxl>=3.0.0",
    "optuna>=3.5.0",
    "scipy>=1.11.0",
    "ccxt>=4.0.0",
    "tqdm>=4.60.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
web3quant = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "hmmlearn>=0.3.0",
    "arch>=7.0.0",
    "plotly>=5.18.0",
    "dash>=2.14.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]
onchain = ["web3>=6.0.0"]
mining = ["deap>=1.4.0"]
pydantic = ["pydantic-settings>=2.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers -v --cov=src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
