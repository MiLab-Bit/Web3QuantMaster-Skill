[package]
name = "wqm-gateway"
version = "6.0.0"
edition = "2021"
authors = ["Freya <freya@sy-realm.ltd>"]
description = "Web3QuantMaster High-Performance Gateway"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
tokio = { version = "1.35", features = ["full"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true  # 移除调试符号，减小二进制大小
