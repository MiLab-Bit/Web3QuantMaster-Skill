[package]
name = "wqm-gateway"
version = "6.0.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
tokio = { version = "1.35", features = ["full"] }
redis = { version = "0.24", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
prost-build = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
