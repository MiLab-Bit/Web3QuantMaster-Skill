version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  gateway:
    build:
      context: ./src/rust_gateway
      dockerfile: Dockerfile
    ports:
      - "8766:8766"
    environment:
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL=60
      - WORKERS=4
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
